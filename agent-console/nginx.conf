server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  location /api/ { proxy_pass http://agent-core-bff:3101; proxy_http_version 1.1; }
  location /orchestration/ { rewrite ^/orchestration/(.*)$ /$1 break; proxy_pass http://agent-manager:8090; proxy_http_version 1.1; proxy_buffering off; proxy_read_timeout 120s; }
  location /runtime/ { rewrite ^/runtime/(.*)$ /$1 break; proxy_pass http://agent-runtime:8088; proxy_http_version 1.1; proxy_buffering off; proxy_read_timeout 120s; }
  location / { try_files $uri $uri/ /index.html; }
}
