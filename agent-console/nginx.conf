server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  # Docker embedded DNS. Keep proxy_pass on a variable so recreate of
  # agent-manager / runtime / bff does not leave nginx holding a stale IP (502 HTML).
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $bff_upstream agent-core-bff:3101;
  set $manager_upstream agent-manager:8090;
  set $runtime_upstream agent-runtime:8088;
  location /api/ { proxy_pass http://$bff_upstream; proxy_http_version 1.1; }
  location /orchestration/ { rewrite ^/orchestration/(.*)$ /$1 break; proxy_pass http://$manager_upstream; proxy_http_version 1.1; proxy_buffering off; proxy_read_timeout 120s; }
  location /runtime/ { rewrite ^/runtime/(.*)$ /$1 break; proxy_pass http://$runtime_upstream; proxy_http_version 1.1; proxy_buffering off; proxy_read_timeout 120s; }
  location = /index.html {
    add_header Cache-Control "no-store";
  }
  location / { add_header Cache-Control "no-store"; try_files $uri $uri/ /index.html; }
}
