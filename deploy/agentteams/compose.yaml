name: chatflows-agentteams
services:
  postgres:
    image: postgres:16.4-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: chatflows
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?required}
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d chatflows"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks: [chatflows]

  redis:
    image: redis:7.2.5-bookworm
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks: [chatflows]

  artifact-bucket-init:
    image: minio/mc:RELEASE.2025-05-21T01-59-54Z-cpuv1
    restart: "no"
    environment:
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:?required}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?required}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?required}
      MINIO_BUCKET: ${MINIO_BUCKET:-chatflows-artifacts}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        until mc alias set artifacts "$$MINIO_ENDPOINT" "$$MINIO_ACCESS_KEY" "$$MINIO_SECRET_KEY"; do sleep 2; done
        mc ls "artifacts/$$MINIO_BUCKET" >/dev/null 2>&1 || mc mb "artifacts/$$MINIO_BUCKET"
    networks: [agentteams]

  db-init:
    build:
      context: ../..
      dockerfile: agent-core/Dockerfile
      target: tools
    restart: "no"
    environment:
      DATABASE_ADMIN_URL: postgresql://postgres:${POSTGRES_ADMIN_PASSWORD:?required}@postgres:5432/chatflows
      CHATFLOWS_APP_DB_PASSWORD: ${CHATFLOWS_APP_DB_PASSWORD:?required}
      AGENT_RUNTIME_DB_PASSWORD: ${AGENT_RUNTIME_DB_PASSWORD:?required}
      DATABASE_SSL: "0"
    depends_on:
      postgres: { condition: service_healthy }
    networks: [chatflows]

  agent-runtime:
    build:
      context: ../../agent-runtime
    restart: unless-stopped
    environment:
      RUNTIME_MODE: production
      RUNTIME_HOST: 0.0.0.0
      RUNTIME_PORT: "8088"
      RUNTIME_AUTH_TOKEN: ${RUNTIME_AUTH_TOKEN:?required}
      RUNTIME_ADMIN_TOKEN: ${RUNTIME_ADMIN_TOKEN:?required}
      RUNTIME_MODEL: ${RUNTIME_MODEL:-dashscope:deepseek-v4-flash}
      RUNTIME_LLM_BASE_URL: ${RUNTIME_LLM_BASE_URL:?required}
      RUNTIME_LLM_TOKEN: ${RUNTIME_LLM_TOKEN:?required}
      AGENT_MODEL_NAME: ${QWEN_MODEL:-deepseek-v4-flash}
      AGENT_MODEL_BASE_URL: ${RUNTIME_LLM_BASE_URL:?required}
      AGENT_MODEL_API_KEY: ${RUNTIME_LLM_TOKEN:?required}
      AGENTSCOPE_WORKSPACE: /app/workspace
      DATABASE_URL: jdbc:postgresql://postgres:5432/chatflows
      DATABASE_USER: agent_runtime_login
      DATABASE_PASSWORD: ${AGENT_RUNTIME_DB_PASSWORD:?required}
      REDIS_URL: redis://redis:6379/0
      RUNTIME_MCP_URL: ${RUNTIME_MCP_URL:?required}
      RUNTIME_MCP_TOKEN: ${RUNTIME_MCP_TOKEN:?required}
      ARTIFACT_INSPECTOR: ${ARTIFACT_INSPECTOR:-on}
      BLUEPRINT_ADMIN_URL: http://agent-core:3100
      BLUEPRINT_ADMIN_TOKEN: ${BLUEPRINT_ADMIN_TOKEN:?required}
      AGENTLOOP_EXPORTER: ${AGENTLOOP_EXPORTER:-off}
      AGENTLOOP_SAMPLE_RATE: ${AGENTLOOP_SAMPLE_RATE:-1.0}
      AGENTLOOP_PROTOCOL: ${AGENTLOOP_PROTOCOL:-otlp}
      OTEL_SERVICE_NAME: vibe-sales-runtime   # 进程固有身份，硬编码防撞名
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-http/protobuf}
      OTEL_RESOURCE_ATTRIBUTES: ${OTEL_RESOURCE_ATTRIBUTES:-}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
      ARMS_LICENSE_KEY: ${ARMS_LICENSE_KEY:-}
      AGENTLOOP_ENDPOINT: ${AGENTLOOP_ENDPOINT:-}
      AGENTLOOP_ACCESS_KEY: ${AGENTLOOP_ACCESS_KEY:-}
      AGENTLOOP_ACCESS_SECRET: ${AGENTLOOP_ACCESS_SECRET:-}
      AISTIO_CONTROL_PLANE_HTTP: ${AISTIO_CONTROL_PLANE_HTTP:-http://host.docker.internal:28081}
      AISTIO_CONTROL_HTTP: ${AISTIO_CONTROL_HTTP:-http://host.docker.internal:28081}
      BUILDER_INTERNAL_TOKEN: ${BUILDER_INTERNAL_TOKEN:-local-dev-internal-token-at-least-32chars}
      AISTIO_AGENT_NAME: ${AISTIO_AGENT_NAME:-chatflows-agent-runtime}
      AISTIO_NAMESPACE: ${AISTIO_NAMESPACE:-chatflows}
      AISTIO_CONTRACT_HTTP_PORT: "28191"
      AISTIO_PUBLIC_BASE_URL: ${AISTIO_PUBLIC_BASE_URL:-http://127.0.0.1:28191}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:28191:28191"
    depends_on:
      db-init: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    networks: [chatflows, agentteams]

  agent-core:
    build:
      context: ../..
      dockerfile: deploy/local/agent-core.Dockerfile
    restart: unless-stopped
    environment:
      WEB_HOST: 0.0.0.0
      WEB_PORT: "3100"
      # manager 的 CHATFLOWS_NEST_URL 打的是本进程，不是 BFF。缺这个会默认 local，
      # 向导「确认发布」会在 Nest 里直接跑完 P4，Worker 再带 proof import 就
      # approval credential mismatch or already consumed（c9e3ad3f 等同型事故）。
      ORCHESTRATION_MODE: ${ORCHESTRATION_MODE:-platform}
      ARTIFACT_INSPECTOR: ${ARTIFACT_INSPECTOR:-on}
      ARTIFACT_STORE: postgres
      DATABASE_URL: postgresql://chatflows_app_login:${CHATFLOWS_APP_DB_PASSWORD:?required}@postgres:5432/chatflows
      DATABASE_POOL_SIZE: "10"
      DATABASE_SSL: "0"
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:?required}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?required}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?required}
      MINIO_BUCKET: ${MINIO_BUCKET:-chatflows-artifacts}
      FLOW_PLATFORM_MODE: ${FLOW_PLATFORM_MODE:-local}
      YUNFLOW_BASE_URL: ${YUNFLOW_BASE_URL:-}
      YUNFLOW_TOKEN: ${YUNFLOW_TOKEN:-}
      YUNFLOW_SPACE_ID: ${YUNFLOW_SPACE_ID:-}
      YUNFLOW_DRY_RUN_PATH: ${YUNFLOW_DRY_RUN_PATH:-/api/workflow/{workflow_id}/run}
      AGENT_RUNTIME_URL: http://agent-runtime:8088
      AGENT_RUNTIME_TOKEN: ${RUNTIME_AUTH_TOKEN:?required}
      BLUEPRINT_ADMIN_TOKEN: ${BLUEPRINT_ADMIN_TOKEN:?required}
      PIPELINE_CONTROL_TOKEN: ${PIPELINE_CONTROL_TOKEN:?required}
      PIPELINE_APPROVAL_SIGNING_SECRET: ${APPROVAL_SIGNING_SECRET:?required}
      MCP_SERVER_TOKEN: ${MCP_SERVER_TOKEN:?required}
      P3C_BUSINESS_MCP_URL: ${RUNTIME_MCP_URL:?required}
      QWEN_BASE_URL: ${NEST_LLM_BASE_URL:?required}
      QWEN_GATEWAY_TOKEN: ${NEST_LLM_TOKEN:?required}
      QWEN_MODEL: ${QWEN_MODEL:-deepseek-v4-flash}
      AGENTLOOP_EXPORTER: ${AGENTLOOP_EXPORTER:-off}
      AGENTLOOP_SAMPLE_RATE: ${AGENTLOOP_SAMPLE_RATE:-1.0}
      AGENTLOOP_PROTOCOL: ${AGENTLOOP_PROTOCOL:-otlp}
      OTEL_SERVICE_NAME: vibe-sales-nest   # 进程固有身份，硬编码防撞名
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-http/protobuf}
      OTEL_RESOURCE_ATTRIBUTES: ${OTEL_RESOURCE_ATTRIBUTES:-}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
      ARMS_LICENSE_KEY: ${ARMS_LICENSE_KEY:-}
      AGENTLOOP_ENDPOINT: ${AGENTLOOP_ENDPOINT:-}
      AGENTLOOP_ACCESS_KEY: ${AGENTLOOP_ACCESS_KEY:-}
      AGENTLOOP_ACCESS_SECRET: ${AGENTLOOP_ACCESS_SECRET:-}
      LOG_STDERR: ${LOG_STDERR:-on}
      LOG_FILE: "off"
    depends_on:
      db-init: { condition: service_completed_successfully }
      artifact-bucket-init: { condition: service_completed_successfully }
      agent-runtime: { condition: service_healthy }
    ports: ["127.0.0.1:${CHATFLOWS_MCP_HOST_PORT:-3100}:3100"]
    networks:
      chatflows:
        aliases: [code-project]
      agentteams:
        aliases: [agent-core.chatflows.local, code-project, code-project.chatflows.local]

  agent-core-bff:
    build:
      context: ../..
      dockerfile: deploy/local/agent-core.Dockerfile
    restart: unless-stopped
    command: ["node", "dist/main-web.js"]
    environment:
      WEB_HOST: 0.0.0.0
      WEB_PORT: "3101"
      WEB_STATIC_ROOT: /tmp/agent-console-dist
      WEB_AUTH_TOKEN: ${WEB_AUTH_TOKEN:?required}
      WEB_AUTH_CLIENT_CODE: ${WEB_AUTH_CLIENT_CODE:?required}
      WEB_AUTH_CREDENTIALS: ${WEB_AUTH_CREDENTIALS:-}
      ORCHESTRATION_MODE: ${ORCHESTRATION_MODE:-platform}
      ARTIFACT_INSPECTOR: ${ARTIFACT_INSPECTOR:-on}
      ARTIFACT_STORE: postgres
      DATABASE_URL: postgresql://chatflows_app_login:${CHATFLOWS_APP_DB_PASSWORD:?required}@postgres:5432/chatflows
      DATABASE_POOL_SIZE: "10"
      DATABASE_SSL: "0"
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:?required}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?required}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?required}
      MINIO_BUCKET: ${MINIO_BUCKET:-chatflows-artifacts}
      FLOW_PLATFORM_MODE: ${FLOW_PLATFORM_MODE:-local}
      YUNFLOW_BASE_URL: ${YUNFLOW_BASE_URL:-}
      YUNFLOW_TOKEN: ${YUNFLOW_TOKEN:-}
      YUNFLOW_SPACE_ID: ${YUNFLOW_SPACE_ID:-}
      YUNFLOW_DRY_RUN_PATH: ${YUNFLOW_DRY_RUN_PATH:-/api/workflow/{workflow_id}/run}
      AGENT_RUNTIME_URL: http://agent-runtime:8088
      AGENT_RUNTIME_TOKEN: ${RUNTIME_AUTH_TOKEN:?required}
      BLUEPRINT_ADMIN_TOKEN: ${BLUEPRINT_ADMIN_TOKEN:?required}
      PIPELINE_CONTROL_TOKEN: ${PIPELINE_CONTROL_TOKEN:?required}
      PIPELINE_APPROVAL_SIGNING_SECRET: ${APPROVAL_SIGNING_SECRET:?required}
      MCP_SERVER_TOKEN: ${MCP_SERVER_TOKEN:?required}
      P3C_BUSINESS_MCP_URL: ${RUNTIME_MCP_URL:?required}
      QWEN_BASE_URL: ${NEST_LLM_BASE_URL:?required}
      QWEN_GATEWAY_TOKEN: ${NEST_LLM_TOKEN:?required}
      QWEN_MODEL: ${QWEN_MODEL:-deepseek-v4-flash}
      LOG_STDERR: ${LOG_STDERR:-on}
      LOG_FILE: "off"
    depends_on:
      db-init: { condition: service_completed_successfully }
      artifact-bucket-init: { condition: service_completed_successfully }
      agent-runtime: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3101/api/health',{headers:{authorization:'Bearer '+process.env.WEB_AUTH_TOKEN,'x-role':'user','x-actor':'health-probe'}}).then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 20
    # 必须进 agentteams：MINIO_ENDPOINT=http://agentteams-controller:9000。
    # 只挂 chatflows 时 GET /api/v1/pipeline/:id 水合 blob 会 ENOTFOUND，向导闸门就会
    # 退回 manager 的 DISPATCHED（—），「确认发布」再 409。
    networks:
      chatflows:
        aliases: [code-project-bff]
      agentteams:

  manager-state-init:
    image: chatflows-agentteams-agent-manager:latest
    restart: "no"
    user: "0:0"
    entrypoint: ["/bin/sh", "-ec"]
    command: ["install -d -o 65532 -g 65532 -m 0700 /data/orchestrator-state"]
    volumes:
      - manager-state:/data/orchestrator-state

  agent-manager:
    image: chatflows-agentteams-agent-manager:latest
    build:
      context: ../../agent-manager
    restart: unless-stopped
    command: ["serve"]
    environment:
      AGENTTEAMS_CONTROLLER_URL: ${AGENTTEAMS_CONTROLLER_URL:?required}
      AGENTTEAMS_AUTH_TOKEN: ${AGENTTEAMS_AUTH_TOKEN:?required}
      AGENTTEAMS_MATRIX_URL: ${AGENTTEAMS_MATRIX_URL:?required}
      AGENTTEAMS_MATRIX_USER_ID: ${AGENTTEAMS_MATRIX_USER_ID:?required}
      AGENTTEAMS_MATRIX_ACCESS_TOKEN: ${AGENTTEAMS_MATRIX_ACCESS_TOKEN:-}
      AGENTTEAMS_MATRIX_PASSWORD: ${AGENTTEAMS_MATRIX_PASSWORD:-}
      AGENTTEAMS_MATRIX_INVITE_USER_ID: ${AGENTTEAMS_MATRIX_INVITE_USER_ID:-}
      AGENTTEAMS_MATRIX_INVITE_PASSWORD: ${AGENTTEAMS_MATRIX_INVITE_PASSWORD:-}
      AGENTTEAMS_E2E_HUMAN_USER_ID: ${AGENTTEAMS_E2E_HUMAN_USER_ID:-}
      AGENTTEAMS_E2E_HUMAN_PASSWORD: ${AGENTTEAMS_E2E_HUMAN_PASSWORD:-}
      CHATFLOWS_TASK_FS_ENDPOINT: ${CHATFLOWS_TASK_FS_ENDPOINT:?required}
      CHATFLOWS_TASK_FS_ACCESS_KEY: ${CHATFLOWS_TASK_FS_ACCESS_KEY:?required}
      CHATFLOWS_TASK_FS_SECRET_KEY: ${CHATFLOWS_TASK_FS_SECRET_KEY:?required}
      CHATFLOWS_TASK_FS_BUCKET: ${CHATFLOWS_TASK_FS_BUCKET:?required}
      CHATFLOWS_TASK_FS_PREFIX: ${CHATFLOWS_TASK_FS_PREFIX:?required}
      CHATFLOWS_APPROVAL_SIGNING_SECRET: ${APPROVAL_SIGNING_SECRET:?required}
      AGENTTEAMS_HUMAN_IDS: ${AGENTTEAMS_HUMAN_IDS:?required}
      AGENTTEAMS_LEADER_IDS: ${AGENTTEAMS_LEADER_IDS:?required}
      AGENTTEAMS_MANAGER_IDS: ${AGENTTEAMS_MANAGER_IDS:?required}
      AGENTTEAMS_RUN_TIMEOUT_SECONDS: ${AGENTTEAMS_RUN_TIMEOUT_SECONDS:-3600}
      AGENTTEAMS_LEADER_ROOM_ID: ${AGENTTEAMS_LEADER_ROOM_ID:-}
      AGENTTEAMS_RUN_CLIENT_CODE: ${AGENTTEAMS_RUN_CLIENT_CODE:-}
      AGENTTEAMS_RUN_ID: ${AGENTTEAMS_RUN_ID:-}
      AGENTTEAMS_RESUME: ${AGENTTEAMS_RESUME:-0}
      AGENTTEAMS_EXPECT_STATUS: SUCCEEDED
      AGENTTEAMS_RUN_SPEC: /specs/e2e-spec.md
      AGENTLOOP_EXPORTER: ${AGENTLOOP_EXPORTER:-off}
      AGENTLOOP_SAMPLE_RATE: ${AGENTLOOP_SAMPLE_RATE:-1.0}
      AGENTLOOP_PROTOCOL: ${AGENTLOOP_PROTOCOL:-otlp}
      OTEL_SERVICE_NAME: vibe-sales-manager   # 进程固有身份，硬编码防撞名
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-http/protobuf}
      OTEL_RESOURCE_ATTRIBUTES: ${OTEL_RESOURCE_ATTRIBUTES:-}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
      ARMS_LICENSE_KEY: ${ARMS_LICENSE_KEY:-}
      AGENTLOOP_ENDPOINT: ${AGENTLOOP_ENDPOINT:-}
      AGENTLOOP_ACCESS_KEY: ${AGENTLOOP_ACCESS_KEY:-}
      AGENTLOOP_ACCESS_SECRET: ${AGENTLOOP_ACCESS_SECRET:-}
      MANAGER_AUTH_TOKEN: ${MANAGER_AUTH_TOKEN:?required}
      MANAGER_ADMIN_TOKEN: ${MANAGER_ADMIN_TOKEN:?required}
      MANAGER_HOST: 0.0.0.0
      MANAGER_PORT: "8090"
      CHATFLOWS_NEST_URL: http://agent-core:3100
      PIPELINE_CONTROL_TOKEN: ${PIPELINE_CONTROL_TOKEN:?required}
      ORCHESTRATOR_LLM: ${ORCHESTRATOR_LLM:-off}
      ORCHESTRATOR_MODEL: ${ORCHESTRATOR_MODEL:-dashscope:deepseek-v4-flash}
      ORCHESTRATOR_LLM_BASE_URL: ${ORCHESTRATOR_LLM_BASE_URL:-}
      HIGRESS_CONSUMER_TOKEN: ${HIGRESS_CONSUMER_TOKEN:-}
      ORCHESTRATOR_STATE_HOME: /data/orchestrator-state
      AGENTTEAMS_TEAM_FILE: /resources/team.yaml
    volumes:
      - ../../docs/agentteams:/specs:ro
      - rendered-resources:/rendered:ro
      - ../../agentteams-resources/team.yaml:/resources/team.yaml:ro
      - manager-state:/data/orchestrator-state
    depends_on:
      agent-core-bff: { condition: service_healthy }
      manager-state-init: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "java", "-cp", "/app/classes:/app/lib/*", "com.yjiyun.chatflows.manager.ManagerHealthProbe"]
      interval: 10s
      timeout: 8s
      retries: 30
    ports: ["127.0.0.1:${AGENT_MANAGER_HOST_PORT:-8090}:8090"]
    networks: [chatflows, agentteams]

  agent-manager-runner:
    profiles: [runner]
    extends: agent-manager
    restart: "no"
    command: ["check"]
    ports: []

  # 改 UI 后不要只 compose up：镜像里是上次 COPY 的 dist。
  # ./scripts/refresh-agentteams-console.sh
  agent-console:
    build:
      context: ../..
      dockerfile: deploy/agentteams/agent-console.Dockerfile
    restart: unless-stopped
    depends_on:
      agent-core: { condition: service_started }
      agent-runtime: { condition: service_healthy }
      agent-manager: { condition: service_healthy }
    ports: ["127.0.0.1:${AGENT_CONSOLE_HOST_PORT:-5173}:8080"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [chatflows]

  verifier:
    profiles: [runner]
    build:
      context: ../..
      dockerfile: agent-core/Dockerfile
      target: verifier
    environment:
      AGENTTEAMS_CONTROLLER_URL: ${AGENTTEAMS_CONTROLLER_URL:?required}
      AGENTTEAMS_AUTH_TOKEN: ${AGENTTEAMS_AUTH_TOKEN:?required}
      AGENTTEAMS_MATRIX_URL: ${AGENTTEAMS_MATRIX_URL:?required}
      AGENTTEAMS_MATRIX_USER_ID: ${AGENTTEAMS_MATRIX_USER_ID:?required}
      AGENTTEAMS_MATRIX_ACCESS_TOKEN: ${AGENTTEAMS_MATRIX_ACCESS_TOKEN:-}
      AGENTTEAMS_MATRIX_PASSWORD: ${AGENTTEAMS_MATRIX_PASSWORD:-}
      AGENTTEAMS_HUMAN_IDS: ${AGENTTEAMS_HUMAN_IDS:?required}
      AGENTTEAMS_LEADER_IDS: ${AGENTTEAMS_LEADER_IDS:?required}
      AGENTTEAMS_MANAGER_IDS: ${AGENTTEAMS_MANAGER_IDS:?required}
      CHATFLOWS_TASK_FS_ENDPOINT: ${CHATFLOWS_TASK_FS_ENDPOINT:?required}
      AGENTTEAMS_E2E_HUMAN_USER_ID: ${AGENTTEAMS_E2E_HUMAN_USER_ID:?required}
      AGENTTEAMS_E2E_HUMAN_ACCESS_TOKEN: ${AGENTTEAMS_E2E_HUMAN_ACCESS_TOKEN:-}
      AGENTTEAMS_E2E_HUMAN_PASSWORD: ${AGENTTEAMS_E2E_HUMAN_PASSWORD:-}
      AGENTTEAMS_LEADER_ROOM_ID: ${AGENTTEAMS_LEADER_ROOM_ID:-}
      AGENTTEAMS_RUN_CLIENT_CODE: ${AGENTTEAMS_RUN_CLIENT_CODE:?required}
      AGENTTEAMS_RUN_TIMEOUT_SECONDS: ${AGENTTEAMS_RUN_TIMEOUT_SECONDS:-3600}
      AGENT_MANAGER_URL: http://agent-manager:8090
      MANAGER_AUTH_TOKEN: ${MANAGER_AUTH_TOKEN:?required}
      CHATFLOWS_TASK_FS_ACCESS_KEY: ${CHATFLOWS_TASK_FS_ACCESS_KEY:?required}
      CHATFLOWS_TASK_FS_SECRET_KEY: ${CHATFLOWS_TASK_FS_SECRET_KEY:?required}
      CHATFLOWS_TASK_FS_BUCKET: ${CHATFLOWS_TASK_FS_BUCKET:?required}
      CHATFLOWS_TASK_FS_PREFIX: ${CHATFLOWS_TASK_FS_PREFIX:?required}
      CHATFLOWS_MCP_BASE_URL: ${CHATFLOWS_MCP_BASE_URL:?required}
      HIGRESS_CONSUMER_TOKEN: ${HIGRESS_CONSUMER_TOKEN:?required}
      CHATFLOWS_NEST_URL: http://agent-core:3100
      AGENT_RUNTIME_URL: http://agent-runtime:8088
      AGENT_RUNTIME_TOKEN: ${RUNTIME_AUTH_TOKEN:?required}
      RUNTIME_AUTH_TOKEN: ${RUNTIME_AUTH_TOKEN:?required}
      CHATFLOWS_APPROVAL_SIGNING_SECRET: ${APPROVAL_SIGNING_SECRET:?required}
      PIPELINE_APPROVAL_SIGNING_SECRET: ${APPROVAL_SIGNING_SECRET:?required}
      DATABASE_URL: postgresql://chatflows_app_login:${CHATFLOWS_APP_DB_PASSWORD:?required}@postgres:5432/chatflows
      AGENT_RUNTIME_DATABASE_URL: postgresql://agent_runtime_login:${AGENT_RUNTIME_DB_PASSWORD:?required}@postgres:5432/chatflows
      DATABASE_SSL: "0"
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:?required}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?required}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?required}
      MINIO_BUCKET: ${MINIO_BUCKET:-chatflows-artifacts}
      REDIS_URL: redis://redis:6379/0
      RUNTIME_LLM_BASE_URL: ${RUNTIME_LLM_BASE_URL:?required}
      RUNTIME_LLM_TOKEN: ${RUNTIME_LLM_TOKEN:?required}
      AGENTLOOP_EXPORTER: ${AGENTLOOP_EXPORTER:-off}
      OTEL_SERVICE_NAME: vibe-sales-verifier   # 测试驱动容器，独立名防混入业务进程
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-http/protobuf}
      OTEL_RESOURCE_ATTRIBUTES: ${OTEL_RESOURCE_ATTRIBUTES:-}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
      ARMS_LICENSE_KEY: ${ARMS_LICENSE_KEY:-}
      AGENTLOOP_ENDPOINT: ${AGENTLOOP_ENDPOINT:-}
      AGENTLOOP_ACCESS_KEY: ${AGENTLOOP_ACCESS_KEY:-}
      AGENTLOOP_ACCESS_SECRET: ${AGENTLOOP_ACCESS_SECRET:-}
    volumes: [rendered-resources:/rendered]
    networks: [chatflows, agentteams]

volumes:
  postgres-data:
  redis-data:
  rendered-resources:
  manager-state:

networks:
  chatflows:
  agentteams:
    external: true
    name: ${AGENTTEAMS_DOCKER_NETWORK:?required}
