# /etc/nginx/sites-available/vibesales
# VibeSales production reverse proxy for the current native deployment layout.
# Current host topology:
#   agent-console dist  -> /var/www/vibesales
#   agent-core BFF      -> 127.0.0.1:3101
#   agent-core MCP      -> 127.0.0.1:3100
#   agent-manager       -> 127.0.0.1:8090
#   agent-runtime       -> 127.0.0.1:8088

server {
    listen 80;
    server_name 10.1.1.42 _;

    access_log /var/log/nginx/vibesales.access.log;
    error_log  /var/log/nginx/vibesales.error.log;
    client_max_body_size 100m;

    root /var/www/vibesales;
    index index.html;

    # Static SPA entry
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Web/BFF APIs used by agent-console
    location /api/ {
        proxy_pass         http://127.0.0.1:3101;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # Orchestration APIs expected by the production console
    location /orchestration/ {
        rewrite ^/orchestration/(.*)$ /$1 break;
        proxy_pass         http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_buffering    off;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # Runtime APIs expected by the production console
    location /runtime/ {
        rewrite ^/runtime/(.*)$ /$1 break;
        proxy_pass         http://127.0.0.1:8088;
        proxy_http_version 1.1;
        proxy_buffering    off;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # MCP server routes served by agent-core MCP plane
    location /mcp-servers/ {
        proxy_pass         http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # Pipeline control plane lives on the MCP process, not the BFF
    location /api/v1/pipeline/ {
        proxy_pass         http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Blueprint admin plane is also served by the MCP process
    location /api/v1/blueprints/ {
        proxy_pass         http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # External health probe entry: reflect the MCP plane health
    location = /healthz {
        access_log off;
        proxy_pass http://127.0.0.1:3100/healthz;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
