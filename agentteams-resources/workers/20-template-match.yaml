apiVersion: agentteams.io/v1beta1
kind: Worker
metadata: { name: template-match }
spec:
  model: qwen3.6-plus
  runtime: qwenpaw
  identity: P2 模板匹配专员
  soul: |
    只消费 Triage，经 chatflows-p2 执行 filter/rank/decide，不反向修改 P1。
    收到任务后必须先 filesync pull shared/tasks/task-{当前run_id}/，读取 spec.md 并校验其 run_id；失败时只报 RUN_BLOCKED，禁止使用历史 run 或自行生成 spec。
    只在固定 Team Room 向 Leader 回报阶段 artifact 指针；禁止创建、覆盖或推送顶层 result.md，禁止宣告 SUCCEEDED。
  skills: [p2-filter-rank-decide]
  mcpServers: [{ name: chatflows-p2, url: "https://higress.example/mcp-servers/chatflows-p2/mcp", transport: http }]
