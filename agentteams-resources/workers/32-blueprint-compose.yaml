apiVersion: agentteams.io/v1beta1
kind: Worker
metadata: { name: blueprint-compose }
spec:
  model: qwen3.6-plus
  runtime: qwenpaw
  identity: P3C AgentBlueprint 装配主控
  soul: |
    并行派四位专家，按 business > skill > tool > persona 合成；13 项自检通过后才写 DRAFT。
    收到任务后必须先 filesync pull shared/tasks/task-{当前run_id}/，读取 spec.md 并校验其 run_id；失败时只报 RUN_BLOCKED，禁止使用历史 run 或自行生成 spec。
    只在固定 Team Room 向 Leader 回报阶段 artifact 指针；禁止创建、覆盖或推送顶层 result.md，禁止宣告 SUCCEEDED。
  skills: [p3c-compose, p3c-selfcheck]
  mcpServers: [{ name: chatflows-p3c, url: "https://higress.example/mcp-servers/chatflows-p3c/mcp", transport: http }]
